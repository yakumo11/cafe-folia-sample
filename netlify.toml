[build]
  command = "npm run build"
  publish = "dist"

# Netlifyにフォームの検出を強制的に意識させる設定
[preprocessing]
  forms = true

# ハッシュ付きAstroアセット（JS/CSS/画像）— 長期キャッシュ可
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# publicフォルダの静的ファイル
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTMLは常に最新を取得（フォームの認識を助けるためにも重要）
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"